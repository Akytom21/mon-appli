<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>PharmaSign – Play Store Banner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: #0F766E;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .banner {
      position: relative;
      width: 1024px;
      height: 500px;
      background: linear-gradient(135deg, #0F766E 0%, #0D6B64 50%, #0A5E58 100%);
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* Cercles décoratifs arrière-plan */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(5, 90, 84, 0.45);
    }
    .circle-1  { width: 420px; height: 420px; top: -120px; left: -80px; }
    .circle-2  { width: 260px; height: 260px; bottom: -80px; left: 80px; }
    .circle-3  { width: 180px; height: 180px; top: 20px;  left: 240px; background: rgba(5, 90, 84, 0.25); }
    .circle-4  { width: 340px; height: 340px; bottom: -140px; right: 60px; }
    .circle-5  { width: 120px; height: 120px; top: -30px; right: 200px; background: rgba(5, 90, 84, 0.3); }
    .circle-6  { width: 80px;  height: 80px;  top: 180px; right: 380px; background: rgba(255,255,255,0.05); }

    /* Colonne gauche – logo */
    .left-col {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 340px;
      height: 100%;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .logo-wrap {
      width: 200px;
      height: 200px;
      border-radius: 32px;
      background: rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25), 0 0 0 3px rgba(255,255,255,0.15);
    }

    .logo-wrap img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      border-radius: 24px;
    }

    /* Séparateur vertical */
    .divider {
      position: relative;
      z-index: 10;
      width: 2px;
      height: 360px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.25) 30%, rgba(255,255,255,0.25) 70%, transparent);
      flex-shrink: 0;
    }

    /* Colonne droite – texte */
    .right-col {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 48px;
      gap: 0;
    }

    .app-name {
      font-size: 72px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 4px;
      line-height: 1;
      text-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .tagline {
      font-size: 18px;
      font-weight: 400;
      color: rgba(255,255,255,0.88);
      margin-top: 12px;
      margin-bottom: 36px;
      letter-spacing: 0.5px;
      line-height: 1.4;
    }

    /* Badges fonctionnalités */
    .badges {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      padding: 12px 16px;
      backdrop-filter: blur(4px);
    }

    .badge-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .badge-text {
      display: flex;
      flex-direction: column;
    }

    .badge-label {
      font-size: 13px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.2;
    }

    .badge-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <!-- Cercles décoratifs -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    <div class="circle circle-4"></div>
    <div class="circle circle-5"></div>
    <div class="circle circle-6"></div>

    <!-- Colonne gauche : logo -->
    <div class="left-col">
      <div class="logo-wrap">
        <img src="../images/logo.png" alt="PharmaSign Logo" />
      </div>
    </div>

    <!-- Séparateur -->
    <div class="divider"></div>

    <!-- Colonne droite : texte + badges -->
    <div class="right-col">
      <div class="app-name">PHARMASIGN</div>
      <div class="tagline">L'accès aux soins en Langue des Signes Française</div>

      <div class="badges">
        <div class="badge">
          <div class="badge-icon">🤟</div>
          <div class="badge-text">
            <span class="badge-label">Interprètes LSF</span>
            <span class="badge-sub">Disponibles 24h/24</span>
          </div>
        </div>

        <div class="badge">
          <div class="badge-icon">🏥</div>
          <div class="badge-text">
            <span class="badge-label">2 350 pros santé</span>
            <span class="badge-sub">Réseau certifié</span>
          </div>
        </div>

        <div class="badge">
          <div class="badge-icon">📅</div>
          <div class="badge-text">
            <span class="badge-label">Prise de RDV</span>
            <span class="badge-sub">Simple & rapide</span>
          </div>
        </div>

        <div class="badge">
          <div class="badge-icon">🎓</div>
          <div class="badge-text">
            <span class="badge-label">Formation LSF</span>
            <span class="badge-sub">Modules e-learning</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
